[package]
license = "Apache-2.0"
name = "xai-grok-peers"
version = "0.1.0"
edition.workspace = true
description = "Live peer registry and local inbox messaging between Grok sessions on one machine"

[dependencies]
chrono = { workspace = true, features = ["serde"] }
fs2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-util", "net", "rt", "macros", "sync", "time"] }
tracing = { workspace = true }
xai-grok-config = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["io-util", "net", "rt", "macros", "sync", "time", "rt-multi-thread"] }

[lints]
workspace = true
